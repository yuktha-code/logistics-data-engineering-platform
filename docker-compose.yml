services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porterdev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porterdev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-logistics}
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U ${POSTGRES_USER:-porterdev} -d ${POSTGRES_DB:-logistics}']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
  airflow:
    profiles: ['airflow']
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow/airflow.db
      AIRFLOW_HOME: /opt/airflow/airflow
      WAREHOUSE_URL: postgresql+psycopg2://${POSTGRES_USER:-porterdev}:${POSTGRES_PASSWORD:-porterdev_change_me}@postgres:5432/${POSTGRES_DB:-logistics}
    volumes:
      - .:/opt/airflow/project
      - airflow_state:/opt/airflow/airflow
    user: '${AIRFLOW_UID:-50000}:0'
    working_dir: /opt/airflow/project
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  warehouse_pgdata:
  airflow_state:
